name: CI Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

# HU01-T5: una sola ejecución vigente por PR o rama. Las ejecuciones
# obsoletas se cancelan para no consumir cuota ni minutos de CI.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests (Jest)
        run: npm test

  quality: # nuevo job con inputs y outputs de SonarCloud para el Quality Gate
    name: SonarCloud Quality Gate
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 10
    # Los PRs de forks no reciben secretos: se omite el análisis en ese caso.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
      checks: write
    # `secrets` no está disponible en `steps.if`, pero sí en `jobs.<id>.env`.
    # Se expone la comprobación como variable para condicionar los pasos.
    env:
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Sonar necesita el historial completo para el blame y las nuevas líneas.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests with coverage (Jest)
        run: npm test

      - name: SonarCloud Scan
        if: env.HAS_SONAR_TOKEN == 'true'
        uses: SonarSource/sonarqube-scan-action@v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate quality report
        if: env.HAS_SONAR_TOKEN == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_PROJECT_KEY: Aoex2612_Proyecto-GPS
          SONAR_MIN_COVERAGE: '80'
          SONAR_MAX_DUPLICATION: '3'
          SONAR_FAIL_ON_QUALITY_GATE: 'true'
        run: node src/quality/cli.js

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: quality-report.json
          if-no-files-found: warn

  # HU01-T5: motor de integración continua. Agrega el resultado de las fases
  # automáticas del contrato (pull_request, analysis y reporting), valida los
  # triggers y deja un informe auditable como artefacto y en el job summary.
  lifecycle:
    name: Lifecycle Gate (HU01-T5)
    runs-on: ubuntu-latest
    needs: [validate, quality]
    # `quality` se omite en PRs de fork: el gate debe seguir evaluando el resto.
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (needs.quality.result == 'success' || needs.quality.result == 'skipped')
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lifecycle engine
        env:
          CI_REPORT_PATH: ci-report.json
          CI_TIMEOUT_MS: '600000'
          CI_TASK_TIMEOUT_MS: '120000'
          CI_ENGINE_FAIL_ON_ERROR: 'true'
        run: node src/pipeline/cli.js

      - name: Upload lifecycle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-lifecycle-report
          path: ci-report.json
          if-no-files-found: warn
