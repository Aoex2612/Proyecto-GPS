# Configuración de SonarCloud para Proyecto-GPS (HU01-T4)
#
# El project key debe coincidir con el proyecto creado en SonarCloud.
# La organización se puede sobreescribir con -Dsonar.organization=... en el
# workflow si el equipo usa otra clave.
sonar.projectKey=Aoex2612_Proyecto-GPS
sonar.organization=aoex2612

sonar.projectName=Proyecto-GPS
sonar.projectVersion=1.0.0

# Código analizado y pruebas
sonar.sources=src
sonar.tests=tests

# Cobertura generada por Jest (npm test)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusiones de análisis
sonar.exclusions=node_modules/**,dist/**,coverage/**
sonar.test.exclusions=node_modules/**

sonar.sourceEncoding=UTF-8
